name: Deploy

# Every push to main builds the site and copies it into S3, which CloudFront
# serves at osama.ahmaro.com (AWS account "personal", 185591434430). The role can
# only be assumed from main and can only write to this site's bucket.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::185591434430:role/github-deploy-osama-site
          aws-region: eu-central-1

      # Hashed bundles first, kept for a year; then the pages, which keep their
      # names between builds, so browsers and CloudFront recheck them on every
      # visit and a deploy shows at once. Old bundles go last, once no page
      # names them.
      - name: Upload to S3
        run: |
          set -euo pipefail
          bucket=s3://osama-site-185591434430
          aws s3 sync dist "$bucket" --exclude '*' --include '_astro/*' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist "$bucket" --delete --exclude '_astro/*' \
            --cache-control 'no-cache'
          aws s3 sync dist/_astro "$bucket/_astro" --delete \
            --cache-control 'public, max-age=31536000, immutable'
